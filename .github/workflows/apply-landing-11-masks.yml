name: Apply landing 11 masks refresh

on:
  push:
    branches:
      - landing-11-masks-fix

permissions:
  contents: write

jobs:
  patch-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: landing-11-masks-fix
          fetch-depth: 0

      - name: Patch and verify
        run: |
          python3 scripts/patch-landing-11-masks.py
          python3 -m json.tool data/site-data.json >/dev/null
          test -s images/11-masok-cover.png
          grep -Fq '"title": "11 масок"' data/site-data.json
          grep -Fq '"href": "https://band.link/2WeFa"' data/site-data.json
          grep -Fq '"title": "Блю Лок — Эго"' data/site-data.json
          git diff --check

      - name: Commit final patch
        run: |
          rm -f .github/workflows/apply-landing-11-masks.yml scripts/patch-landing-11-masks.py
          git add index.html .github/workflows/apply-landing-11-masks.yml scripts/patch-landing-11-masks.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[landing-patch-done] Sync landing fallback and catalog'
          git push origin HEAD:landing-11-masks-fix
