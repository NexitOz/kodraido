name: Sync landing fallback once

on:
  push:
    branches:
      - claude/landing-vercel-deploy-01i3om

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/landing-vercel-deploy-01i3om
          fetch-depth: 0

      - name: Synchronize fallback data and featured markup
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          data = json.loads(Path('data/site-data.json').read_text(encoding='utf-8'))

          marker = 'const FALLBACK_DATA = '
          start = text.index(marker)
          brace = text.index('{', start)
          depth = 0
          end_brace = None
          in_str = None
          escape = False
          for i in range(brace, len(text)):
              ch = text[i]
              if in_str:
                  if escape:
                      escape = False
                  elif ch == '\\':
                      escape = True
                  elif ch == in_str:
                      in_str = None
                  continue
              if ch in ('"', "'", '`'):
                  in_str = ch
                  continue
              if ch == '{':
                  depth += 1
              elif ch == '}':
                  depth -= 1
                  if depth == 0:
                      end_brace = i
                      break
          if end_brace is None:
              raise RuntimeError('Could not locate FALLBACK_DATA closing brace')

          semi = text.find(';', end_brace)
          if semi == -1:
              raise RuntimeError('Could not locate FALLBACK_DATA semicolon')
          replacement = 'const FALLBACK_DATA = ' + json.dumps(data, ensure_ascii=False, indent=2) + ';'
          text = text[:start] + replacement + text[semi+1:]

          card_start = text.find('    <a class="featured-card" id="featuredSecondaryCard"')
          if card_start != -1:
              card_end = text.find('    </a>', card_start)
              if card_end == -1:
                  raise RuntimeError('Could not locate secondary featured card ending')
              card_end += len('    </a>')
              if card_end < len(text) and text[card_end] == '\n':
                  card_end += 1
              text = text[:card_start] + text[card_end:]

          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          python3 -m json.tool data/site-data.json >/dev/null
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git add index.html
          git commit -m "Sync landing fallback with latest content"
          git push origin HEAD:claude/landing-vercel-deploy-01i3om
