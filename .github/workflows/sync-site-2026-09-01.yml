name: One-shot site update 2026-09-01

on:
  push:
    branches:
      - site-update-2026-09-01

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-update-2026-09-01
          fetch-depth: 0

      - name: Patch site content
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          data_path = Path('data/site-data.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))

          data['featuredReleaseSecondary'] = {
              'badge': 'Сингл',
              'title': 'Корзинка фруктов — Когда растает снег',
              'description': 'Сингл КОД РАЙДО уже доступен на музыкальных площадках.',
              'cover': '/images/korzinka-fruktov-kogda-rastaet-sneg-cover.png',
              'cta': 'Слушать сейчас',
              'href': 'https://band.link/IQD2a'
          }
          data['presave'] = {
              'eyebrow': '❄️ новый пресейв открыт',
              'title': '11 масок.',
              'accent': 'Пресейв открыт.',
              'description': 'Открой пресейв — трек появится в твоей библиотеке сразу после релиза.',
              'cover': '/images/11-masok-cover.png',
              'cta': 'Открыть пресейв',
              'href': 'https://band.link/2WeFa'
          }
          data.pop('presaveSecondary', None)

          progress = []
          for item in data.get('inProgress', []):
              if item.get('title') == 'Гробница падших богов':
                  continue
              if item.get('title') == 'D.Gray-man':
                  item = dict(item)
                  item['percent'] = 100
              progress.append(item)
          data['inProgress'] = progress

          news_title = 'Вышел «Между смертью и тобой»'
          data['news'] = [item for item in data.get('news', []) if item.get('title') != news_title]
          data['news'].insert(0, {
              'icon': '⭐',
              'status': 'уже в эфире',
              'title': news_title,
              'text': 'Сингл уже доступен на музыкальных площадках — слушай прямо сейчас.',
              'href': 'https://band.link/5g0NH'
          })
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          replacements = [
              ('<a class="featured-card" id="featuredSecondaryCard" href="https://band.link/5g0NH" target="_blank" rel="noopener">',
               '<a class="featured-card" id="featuredSecondaryCard" href="https://band.link/IQD2a" target="_blank" rel="noopener">'),
              ('<img id="featuredSecondaryCover" src="/images/mezhdu-smertyu-i-toboy-cover.png" alt="Обложка сингла «Между смертью и тобой»">',
               '<img id="featuredSecondaryCover" src="/images/korzinka-fruktov-kogda-rastaet-sneg-cover.png" alt="Обложка сингла «Корзинка фруктов — Когда растает снег»">'),
              ('<div class="featured-title" id="featuredSecondaryTitle">Между смертью и тобой</div>',
               '<div class="featured-title" id="featuredSecondaryTitle">Корзинка фруктов — Когда растает снег</div>'),
              ('<div class="eyebrow" id="presaveEyebrow">🔥 скоро выходит</div>',
               '<div class="eyebrow" id="presaveEyebrow">❄️ новый пресейв открыт</div>'),
              ('<h2><span id="presaveTitle">Корзинка фруктов —</span><br><span class="accent" id="presaveAccent">Когда растает снег.</span></h2>',
               '<h2><span id="presaveTitle">11 масок.</span><br><span class="accent" id="presaveAccent">Пресейв открыт.</span></h2>'),
              ('<p class="lede" id="presaveDesc">Открой пресейв нового релиза — трек появится в твоей библиотеке сразу после выхода.</p>',
               '<p class="lede" id="presaveDesc">Открой пресейв — трек появится в твоей библиотеке сразу после релиза.</p>'),
              ('<img id="presaveCoverImage" src="/images/korzinka-fruktov-kogda-rastaet-sneg-cover.png" alt="Обложка «Корзинка фруктов — Когда растает снег»">',
               '<img id="presaveCoverImage" src="/images/11-masok-cover.png" alt="Обложка «11 масок»">'),
              ('<a class="btn-solid presave-btn" id="presaveBtn" href="https://band.link/IQD2a" target="_blank" rel="noopener">',
               '<a class="btn-solid presave-btn" id="presaveBtn" href="https://band.link/2WeFa" target="_blank" rel="noopener">'),
              ('<div class="presave-entry" id="presaveSecondaryEntry">',
               '<div class="presave-entry" id="presaveSecondaryEntry" hidden>'),
          ]
          for old, new in replacements:
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:100]}')
              html = html.replace(old, new, 1)

          html, count = re.subn(
              r"    featuredReleaseSecondary: \{\n.*?\n    \},\n    presave: \{",
              """    featuredReleaseSecondary: {
      badge:'Сингл', title:'Корзинка фруктов — Когда растает снег',
      description:'Сингл КОД РАЙДО уже доступен на музыкальных площадках.',
      cover:'/images/korzinka-fruktov-kogda-rastaet-sneg-cover.png',
      cta:'Слушать сейчас', href:'https://band.link/IQD2a'
    },
    presave: {""",
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'featuredReleaseSecondary fallback replacement count={count}')

          html, count = re.subn(
              r"    presave: \{\n.*?\n    \},\n    presaveSecondary: \{\n.*?\n    \},\n    inProgress: \[",
              """    presave: {
      eyebrow:'❄️ новый пресейв открыт', title:'11 масок.', accent:'Пресейв открыт.',
      description:'Открой пресейв — трек появится в твоей библиотеке сразу после релиза.',
      cover:'/images/11-masok-cover.png', cta:'Открыть пресейв', href:'https://band.link/2WeFa'
    },
    presaveSecondary: null,
    inProgress: [""",
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'presave fallback replacement count={count}')

          html, count = re.subn(
              r"    inProgress: \[\n.*?\n    \],\n    news: \[",
              """    inProgress: [
      { title:'Начало после конца', percent:40 },
      { title:'Новый видеошот', percent:80 },
      { title:'D.Gray-man', percent:100 }
    ],
    news: [
      { icon:'⭐', status:'уже в эфире', title:'Вышел «Между смертью и тобой»', text:'Сингл уже доступен на музыкальных площадках — слушай прямо сейчас.', href:'https://band.link/5g0NH' },""",
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'progress/news fallback replacement count={count}')

          index_path.write_text(html, encoding='utf-8')

          # Assertions for the requested state.
          final = json.loads(data_path.read_text(encoding='utf-8'))
          assert final['featuredReleaseSecondary']['title'] == 'Корзинка фруктов — Когда растает снег'
          assert final['presave']['title'] == '11 масок.'
          assert 'presaveSecondary' not in final
          assert all(x['title'] != 'Гробница падших богов' for x in final['inProgress'])
          assert next(x for x in final['inProgress'] if x['title'] == 'D.Gray-man')['percent'] == 100
          assert final['news'][0]['title'] == 'Вышел «Между смертью и тобой»'
          assert 'id="presaveSecondaryEntry" hidden' in html
          PY

          python3 -m json.tool data/site-data.json >/dev/null
          git diff --check

          rm .github/workflows/sync-site-2026-09-01.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update featured release, presave, news and progress"
          git push origin HEAD:site-update-2026-09-01
